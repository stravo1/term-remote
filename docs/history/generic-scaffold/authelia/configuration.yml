---
###############################################################
# Authelia - minimal single-user configuration.
# Replace every CHANGE_ME value before starting.
###############################################################

theme: auto

server:
  address: 'tcp://:9091'

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: 'CHANGE_ME_openssl_rand_hex_32'

authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

access_control:
  default_policy: deny
  rules:
    # The portal itself must stay reachable, or nobody can log in.
    - domain: auth.example.com
      policy: bypass

    # Raise to two_factor once a TOTP/WebAuthn device is registered,
    # otherwise the first login dead-ends on a missing second factor.
    - domain: term.example.com
      policy: one_factor

session:
  name: authelia_session
  secret: 'CHANGE_ME_openssl_rand_hex_32'
  expiration: 1h
  inactivity: 10m
  cookies:
    # Parent domain, so the SSO cookie is sent to both auth. and term.
    - domain: example.com
      authelia_url: https://auth.example.com

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: 'CHANGE_ME_openssl_rand_hex_32'
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notifications.txt
