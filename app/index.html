<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="Browser terminal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="term" />
    <meta name="color-scheme" content="dark" />
    <title>term</title>
    <script>
      // Paint the saved theme before the app loads, so a light page does not
      // flash dark. "system" (the default) follows the OS setting. The status
      // bar color follows the scheme the same way.
      try {
        const choice = localStorage.getItem("term-remote:theme") ?? "system";
        const isDark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", isDark ? "#1a1a1a" : "#ffffff");
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", isDark ? "dark" : "light");
      } catch {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/vendor/fonts.css" />
    <link rel="stylesheet" href="/vendor/espresso.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="screen" id="screen">
        <div id="terminal"></div>
      </main>

      <nav class="keys" id="keys" aria-label="Terminal controls and keys"></nav>
    </div>

    <button class="settings-fab" id="settings-fab" type="button" aria-label="Settings" aria-haspopup="dialog"></button>

    <div class="overlay" id="overlay" hidden>
      <p class="overlay-text" id="overlay-text">Disconnected</p>
      <button class="key" id="retry" type="button" hidden>Reconnect</button>
    </div>

    <dialog class="settings" id="settings" aria-labelledby="settings-title">
      <header class="settings-header">
        <h2 class="settings-title" id="settings-title">Settings</h2>
        <button class="key settings-close" id="settings-close" type="button" aria-label="Close settings">×</button>
      </header>

      <section class="settings-section">
        <h3 class="settings-label" id="settings-theme-label">Theme</h3>
        <div class="settings-options" role="group" aria-labelledby="settings-theme-label">
          <button class="key option" type="button" data-theme-choice="system" aria-pressed="false">System</button>
          <button class="key option" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button class="key option" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-label" id="settings-font-label">Text size</h3>
        <div class="settings-options" role="group" aria-labelledby="settings-font-label">
          <button class="key" id="font-down" type="button" aria-label="Smaller text">A−</button>
          <output class="settings-value" id="font-value">13</output>
          <button class="key" id="font-up" type="button" aria-label="Larger text">A+</button>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-label" id="settings-connection-label">Connection</h3>
        <div class="settings-options" role="group" aria-labelledby="settings-connection-label">
          <span class="settings-value" id="connection-state">Connected</span>
          <button class="key" id="reconnect" type="button">Reconnect</button>
        </div>
      </section>
    </dialog>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
